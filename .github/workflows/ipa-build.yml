name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. SELECT XCODE
      # ============================================================
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcodebuild -version
          xcodebuild -showsdks

      # ============================================================
      # 3. GET IPHONEOS SDK
      # ============================================================
      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IPHONEOS SDK"
          echo "======================================"

          echo "$SDK"

          test -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          echo "iPhoneOS SDK found."

      # ============================================================
      # 4. SET PROJECT PATHS
      # ============================================================
      - name: Set project paths
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$GITHUB_WORKSPACE/FF-CACHE-MANAGER-SOURCE"
          APP_ROOT="$PROJECT_ROOT/app/ff_manager"
          BUILD_PS1="$APP_ROOT/build.ps1"
          RELEASE_DIR="$PROJECT_ROOT/release"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_PS1=$BUILD_PS1" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "PROJECT"
          echo "======================================"

          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo "APP_ROOT:"
          echo "$APP_ROOT"

          echo "BUILD_PS1:"
          echo "$BUILD_PS1"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          test -d "$PROJECT_ROOT"
          test -d "$APP_ROOT"
          test -f "$BUILD_PS1"

          echo "Project paths OK."

      # ============================================================
      # 5. INSTALL BUILD TOOLS
      # ============================================================
      - name: Install build tools
        shell: bash
        run: |
          set -e

          brew update
          brew install llvm sevenzip

          echo "======================================"
          echo "BUILD TOOLS"
          echo "======================================"

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          STRIP="$LLVM/llvm-strip"
          LD="$(xcrun --find ld)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"
          SEVENZIP="$(command -v 7zz)"

          test -f "$CLANG"
          test -f "$STRIP"
          test -f "$LD"
          test -f "$LIPO"
          test -f "$INSTALL_NAME"
          test -f "$SEVENZIP"

          echo "clang: $CLANG"
          echo "llvm-strip: $STRIP"
          echo "ld: $LD"
          echo "lipo: $LIPO"
          echo "install_name_tool: $INSTALL_NAME"
          echo "7z: $SEVENZIP"

          echo "LLVM_BIN=$LLVM" >> "$GITHUB_ENV"
          echo "CLANG=$CLANG" >> "$GITHUB_ENV"
          echo "STRIP=$STRIP" >> "$GITHUB_ENV"
          echo "LD=$LD" >> "$GITHUB_ENV"
          echo "LIPO=$LIPO" >> "$GITHUB_ENV"
          echo "INSTALL_NAME=$INSTALL_NAME" >> "$GITHUB_ENV"
          echo "SEVENZIP=$SEVENZIP" >> "$GITHUB_ENV"

          echo "Build tools found."

      # ============================================================
      # 6. PREPARE TOOLS FOR build.ps1
      # ============================================================
      - name: Prepare build tools
        shell: bash
        run: |
          set -e

          TOOLS="$APP_ROOT/.tools"

          mkdir -p "$TOOLS"

          ln -sf "$CLANG" \
            "$TOOLS/clang.exe"

          ln -sf "$STRIP" \
            "$TOOLS/llvm-strip.exe"

          ln -sf "$LD" \
            "$TOOLS/ld64.lld.exe"

          ln -sf "$LIPO" \
            "$TOOLS/llvm-lipo.exe"

          ln -sf "$INSTALL_NAME" \
            "$TOOLS/llvm-install-name-tool.exe"

          ln -sf "$SEVENZIP" \
            "$TOOLS/7z.exe"

          chmod +x "$TOOLS"/*

          echo "$TOOLS" >> "$GITHUB_PATH"

          echo "======================================"
          echo "TOOLS READY"
          echo "======================================"

          ls -la "$TOOLS"

      # ============================================================
      # 7. BUILD IPA
      # ============================================================
      - name: Build IPA
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "START BUILD"
          echo "======================================"

          echo "Build script:"
          echo "$BUILD_PS1"

          echo "SDK:"
          echo "$IOS_SDK"

          echo "Output:"
          echo "$RELEASE_DIR"

          mkdir -p "$RELEASE_DIR"

          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File "$BUILD_PS1" \
            -Offline \
            -OutputDirectory "$RELEASE_DIR"

          echo "======================================"
          echo "BUILD FINISHED"
          echo "======================================"

      # ============================================================
      # 8. CHECK IPA
      # ============================================================
      - name: Check IPA
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          echo "======================================"
          echo "IPA FILES"
          echo "======================================"

          IPA_COUNT="$(
            find "$RELEASE_DIR" \
              -type f \
              -name "*.ipa" \
              | wc -l \
              | tr -d ' '
          )"

          echo "IPA COUNT: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "No IPA file was generated."
            exit 1
          fi

          echo "IPA generated successfully."

      # ============================================================
      # 9. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: ${{ env.RELEASE_DIR }}/*.ipa
          if-no-files-found: error
