name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "XCODE:"
          xcodebuild -version

          echo "SDK:"
          xcodebuild -showsdks

      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          if [ -z "$IOS_SDK" ]; then
            echo "ERROR: iPhoneOS SDK not found"
            exit 1
          fi

          echo "IOS_SDK=$IOS_SDK" >> "$GITHUB_ENV"

          echo "iPhoneOS SDK:"
          echo "$IOS_SDK"

      - name: Set project paths
        shell: bash
        run: |
          set -e

          PROJECT_ROOT="$GITHUB_WORKSPACE/FF-CACHE-MANAGER-SOURCE"
          BUILD_SCRIPT="$PROJECT_ROOT/BUILD-WINDOWS.ps1"
          RELEASE_DIR="$PROJECT_ROOT/release"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_SCRIPT=$BUILD_SCRIPT" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT ROOT"
          echo "$PROJECT_ROOT"
          echo "========================================"

          if [ ! -d "$PROJECT_ROOT" ]; then
            echo "ERROR: Project directory not found"
            exit 1
          fi

          if [ ! -f "$BUILD_SCRIPT" ]; then
            echo "ERROR: BUILD-WINDOWS.ps1 not found"
            exit 1
          fi

          mkdir -p "$RELEASE_DIR"

      - name: Install build tools
        shell: bash
        run: |
          set -e

          if ! command -v pwsh >/dev/null 2>&1; then
            brew install --cask powershell
          fi

          echo "PowerShell:"
          pwsh --version

      - name: Prepare build tools
        shell: bash
        run: |
          set -e

          chmod +x "$BUILD_SCRIPT" || true

          echo "Build script:"
          ls -lh "$BUILD_SCRIPT"

          echo "Release directory:"
          mkdir -p "$RELEASE_DIR"
          ls -la "$RELEASE_DIR"

      - name: Build IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "BUILD IPA"
          echo "========================================"
          echo "PROJECT_ROOT: $PROJECT_ROOT"
          echo "BUILD_SCRIPT: $BUILD_SCRIPT"
          echo "RELEASE_DIR:  $RELEASE_DIR"
          echo "IOS_SDK:      $IOS_SDK"
          echo "========================================"

          cd "$PROJECT_ROOT"

          pwsh -NoProfile -ExecutionPolicy Bypass \
            -File "$BUILD_SCRIPT" \
            -OutputDirectory "$RELEASE_DIR"

          echo "========================================"
          echo "BUILD COMMAND FINISHED"
          echo "========================================"

      - name: Find IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR IPA"
          echo "========================================"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "ERROR: Release directory does not exist"
            exit 1
          fi

          find "$RELEASE_DIR" \
            -type f \
            \( -iname "*.ipa" -o -iname "*.zip" \) \
            -print

          IPA_COUNT=$(find "$RELEASE_DIR" -type f -iname "*.ipa" | wc -l | tr -d ' ')

          echo "IPA_COUNT=$IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "WARNING: No IPA was generated"
          else
            echo "IPA generated successfully"
          fi

      - name: Check IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CHECK GENERATED FILES"
          echo "========================================"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          echo "========================================"
          echo "IPA FILES"
          echo "========================================"

          find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -iname "*.ipa" \
            -print

      - name: Show generated files
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "GENERATED FILES"
          echo "========================================"

          if [ -d "$RELEASE_DIR" ]; then
            find "$RELEASE_DIR" -maxdepth 3 -type f -print
          else
            echo "Release directory not found"
          fi

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Build-IPA
          path: |
            FF-CACHE-MANAGER-SOURCE/release/*.ipa
            FF-CACHE-MANAGER-SOURCE/release/*.zip
          if-no-files-found: warn
