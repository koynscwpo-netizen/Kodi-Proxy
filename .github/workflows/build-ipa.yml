name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. SELECT XCODE
      # ============================================================
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "======================================"
          echo "XCODE"
          echo "======================================"

          xcodebuild -version
          xcodebuild -showsdks

      # ============================================================
      # 3. GET IPHONEOS SDK
      # ============================================================
      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          if [ ! -d "$SDK" ]; then
            echo "iPhoneOS SDK was not found:"
            echo "$SDK"
            exit 1
          fi

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "======================================"
          echo "IPHONEOS SDK"
          echo "======================================"
          echo "$SDK"

          if [ ! -f "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h" ]; then
            echo "UIKit/UIKit.h was not found."
            exit 1
          fi

          echo "UIKit/UIKit.h found."

      # ============================================================
      # 4. FIND PROJECT
      # ============================================================
      - name: Find project root
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCH PROJECT"
          echo "======================================"

          SCRIPT="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name 'BUILD-WINDOWS.ps1' \
            -print -quit)"

          if [ -z "$SCRIPT" ]; then
            echo "BUILD-WINDOWS.ps1 was not found."
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SCRIPT")"
          BUILD_PS1="$PROJECT_ROOT/app/ff_manager/build.ps1"

          if [ ! -f "$BUILD_PS1" ]; then
            echo "build.ps1 was not found:"
            echo "$BUILD_PS1"
            exit 1
          fi

          RELEASE_DIR="$PROJECT_ROOT/release"

          echo "BUILD SCRIPT:"
          echo "$SCRIPT"

          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          echo "BUILD PS1:"
          echo "$BUILD_PS1"

          echo "RELEASE DIR:"
          echo "$RELEASE_DIR"

          echo "BUILD_SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 5. INSTALL BUILD TOOLS
      # ============================================================
      - name: Install build tools
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALL BUILD TOOLS"
          echo "======================================"

          brew install llvm sevenzip || true

          echo "LLVM:"
          brew --prefix llvm

          echo "7-ZIP:"
          command -v 7zz || true

      # ============================================================
      # 6. INSTALL PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependency
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "PYTHON"
          echo "======================================"

          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          . "$GITHUB_WORKSPACE/.venv/bin/activate"

          python -m pip install --upgrade pip
          python -m pip install lief Pillow

          python --version

          python -c "import lief; print('LIEF:', lief.__version__)"
          python -c "from PIL import Image, ImageDraw; import PIL; print('Pillow:', PIL.__version__)"

          echo "PYTHON_OK=1" >> "$GITHUB_ENV"

      # ============================================================
      # 7. PREPARE BUILD TOOLS
      # ============================================================
      - name: Prepare build tools
        shell: bash
        run: |
          set -e

          TOOLS="$PROJECT_ROOT/app/ff_manager/.tools"

          mkdir -p "$TOOLS"

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          STRIP="$LLVM/llvm-strip"

          LD="$(xcrun --find ld)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"
          SEVENZIP="$(command -v 7zz)"

          echo "======================================"
          echo "CHECK TOOLS"
          echo "======================================"

          test -f "$CLANG"
          test -f "$STRIP"
          test -f "$LD"
          test -f "$LIPO"
          test -f "$INSTALL_NAME"
          test -f "$SEVENZIP"

          echo "clang: $CLANG"
          echo "llvm-strip: $STRIP"
          echo "ld: $LD"
          echo "lipo: $LIPO"
          echo "install_name_tool: $INSTALL_NAME"
          echo "7zz: $SEVENZIP"

          # --------------------------------------------------------
          # Create Windows-style names expected by build.ps1
          # --------------------------------------------------------

          ln -sf "$CLANG" \
            "$TOOLS/clang.exe"

          ln -sf "$STRIP" \
            "$TOOLS/llvm-strip.exe"

          ln -sf "$LD" \
            "$TOOLS/ld64.lld.exe"

          ln -sf "$LIPO" \
            "$TOOLS/llvm-lipo.exe"

          ln -sf "$INSTALL_NAME" \
            "$TOOLS/llvm-install-name-tool.exe"

          ln -sf "$SEVENZIP" \
            "$TOOLS/7z.exe"

          chmod +x "$TOOLS"/*

          echo "$TOOLS" >> "$GITHUB_PATH"

          echo "======================================"
          echo "TOOLS READY"
          echo "======================================"

          ls -la "$TOOLS"

          "$STRIP" --version
          "$TOOLS/7z.exe" --help >/dev/null

          echo "7z.exe is working."

      # ============================================================
      # 8. VERIFY PROJECT
      # ============================================================
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFY PROJECT"
          echo "======================================"

          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo "BUILD_SCRIPT:"
          echo "$BUILD_SCRIPT"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          test -f "$BUILD_SCRIPT"
          test -f "$PROJECT_ROOT/app/ff_manager/build.ps1"

          test -x "$GITHUB_WORKSPACE/.venv/bin/python"

          "$GITHUB_WORKSPACE/.venv/bin/python" \
            -c "from PIL import Image, ImageDraw; import lief; print('Python dependencies OK')"

          command -v 7z.exe
          command -v llvm-strip.exe

          echo "======================================"
          echo "PROJECT CONTENTS"
          echo "======================================"

          ls -la "$PROJECT_ROOT"

          echo "======================================"
          echo "FF MANAGER"
          echo "======================================"

          ls -la "$PROJECT_ROOT/app/ff_manager"

          echo "======================================"
          echo "VERIFICATION PASSED"
          echo "======================================"

      # ============================================================
      # 9. BUILD IPA
      # ============================================================
      - name: Build IPA
        shell: pwsh
        env:
          IOS_SDK: ${{ env.IOS_SDK }}
          PROJECT_ROOT: ${{ env.PROJECT_ROOT }}
          BUILD_SCRIPT: ${{ env.BUILD_SCRIPT }}
          RELEASE_DIR: ${{ env.RELEASE_DIR }}
          FF_TOOLS_ROOT: ${{ env.PROJECT_ROOT }}/app/ff_manager/.tools
          PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "======================================"
          Write-Host "FF CACHE MANAGER IPA BUILD"
          Write-Host "======================================"

          Write-Host "PROJECT_ROOT:"
          Write-Host $env:PROJECT_ROOT

          Write-Host "BUILD_SCRIPT:"
          Write-Host $env:BUILD_SCRIPT

          Write-Host "IOS_SDK:"
          Write-Host $env:IOS_SDK

          Write-Host "FF_TOOLS_ROOT:"
          Write-Host $env:FF_TOOLS_ROOT

          Write-Host "PYTHON:"
          Write-Host $env:PYTHON

          # --------------------------------------------------------
          # Verify SDK
          # --------------------------------------------------------

          $UIKitHeader = Join-Path `
            $env:IOS_SDK `
            "System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          if (-not (Test-Path -LiteralPath $UIKitHeader)) {
              throw "UIKit/UIKit.h was not found."
          }

          # --------------------------------------------------------
          # Verify build scripts
          # --------------------------------------------------------

          if (-not (Test-Path -LiteralPath $env:BUILD_SCRIPT)) {
              throw "BUILD-WINDOWS.ps1 was not found."
          }

          $BuildPS1 = Join-Path `
            $env:PROJECT_ROOT `
            "app/ff_manager/build.ps1"

          if (-not (Test-Path -LiteralPath $BuildPS1)) {
              throw "app/ff_manager/build.ps1 was not found."
          }

          # --------------------------------------------------------
          # Verify Python
          # --------------------------------------------------------

          if (-not (Test-Path -LiteralPath $env:PYTHON)) {
              throw "Python virtual environment was not found."
          }

          & $env:PYTHON -c "from PIL import Image, ImageDraw; import lief; print('PIL and LIEF OK')"

          if ($LASTEXITCODE -ne 0) {
              throw "Python dependency verification failed."
          }

          # --------------------------------------------------------
          # Verify tools
          # --------------------------------------------------------

          $ToolsDir = $env:FF_TOOLS_ROOT

          if (-not (Test-Path -LiteralPath "$ToolsDir/llvm-strip.exe")) {
              throw "llvm-strip.exe was not found."
          }

          if (-not (Test-Path -LiteralPath "$ToolsDir/7z.exe")) {
              throw "7z.exe was not found."
          }

          # --------------------------------------------------------
          # Prepare release directory
          # --------------------------------------------------------

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:RELEASE_DIR | Out-Null

          # --------------------------------------------------------
          # BUILD
          # --------------------------------------------------------

          Write-Host "======================================"
          Write-Host "START BUILD"
          Write-Host "======================================"

          & $env:BUILD_SCRIPT `
            -IosSdk "$env:IOS_SDK" `
            -OutputDirectory "$env:RELEASE_DIR"

          if ($LASTEXITCODE -ne 0) {
              throw "IPA build failed with exit code $LASTEXITCODE"
          }

          Write-Host "======================================"
          Write-Host "BUILD SCRIPT FINISHED"
          Write-Host "======================================"

      # ============================================================
      # 10. CHECK GENERATED FILES
      # ============================================================
      - name: Check IPA
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECK GENERATED FILES"
          echo "======================================"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory was not created:"
            echo "$RELEASE_DIR"
            exit 1
          fi

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          echo "======================================"
          echo "RELEASE FILES"
          echo "======================================"

          find "$RELEASE_DIR" \
            -maxdepth 5 \
            -type f \
            -print

          echo "======================================"
          echo "SEARCH IPA"
          echo "======================================"

          IPA_COUNT="$(find "$RELEASE_DIR" \
            -type f \
            -name "*.ipa" \
            | wc -l \
            | tr -d ' ')"

          echo "IPA COUNT: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "No IPA file was generated."

            echo "======================================"
            echo "SEARCH APP"
            echo "======================================"

            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*.app" \
              -print

            echo "======================================"
            echo "SEARCH ZIP"
            echo "======================================"

            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -print

            exit 1
          fi

          echo "======================================"
          echo "IPA FOUND"
          echo "======================================"

          find "$RELEASE_DIR" \
            -type f \
            -name "*.ipa" \
            -print

      # ============================================================
      # 11. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: ${{ env.RELEASE_DIR }}/**/*.ipa
          if-no-files-found: error
