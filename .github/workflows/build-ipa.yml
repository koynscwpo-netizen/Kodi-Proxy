name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # 2. SELECT XCODE
      # ============================================================
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          xcodebuild -version
          xcodebuild -showsdks

      # ============================================================
      # 3. GET IPHONEOS SDK
      # ============================================================
      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          if [ ! -d "$IOS_SDK" ]; then
            echo "iPhoneOS SDK not found"
            exit 1
          fi

          echo "IOS_SDK=$IOS_SDK" >> "$GITHUB_ENV"

          echo "========================================"
          echo "IPHONEOS SDK"
          echo "========================================"
          echo "$IOS_SDK"

          test -f \
            "$IOS_SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"

          echo "UIKit/UIKit.h OK"

      # ============================================================
      # 4. FIND PROJECT
      # ============================================================
      - name: Find project root
        shell: bash
        run: |
          set -e

          SCRIPT="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "BUILD-WINDOWS.ps1" \
            -print -quit)"

          if [ -z "$SCRIPT" ]; then
            echo "BUILD-WINDOWS.ps1 not found"
            exit 1
          fi

          PROJECT_ROOT="$(dirname "$SCRIPT")"
          BUILD_PS1="$PROJECT_ROOT/app/ff_manager/build.ps1"
          RELEASE_DIR="$PROJECT_ROOT/release"

          if [ ! -f "$BUILD_PS1" ]; then
            echo "build.ps1 not found:"
            echo "$BUILD_PS1"
            exit 1
          fi

          echo "BUILD_SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "FF_TOOLS_ROOT=$PROJECT_ROOT/app/ff_manager/.tools" >> "$GITHUB_ENV"

          echo "========================================"
          echo "PROJECT"
          echo "========================================"
          echo "BUILD_SCRIPT=$SCRIPT"
          echo "PROJECT_ROOT=$PROJECT_ROOT"
          echo "BUILD_PS1=$BUILD_PS1"
          echo "RELEASE_DIR=$RELEASE_DIR"

      # ============================================================
      # 5. INSTALL ONLY REQUIRED EXTERNAL TOOLS
      # ============================================================
      - name: Install build tools
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "INSTALL BUILD TOOLS"
          echo "========================================"

          brew update

          # Do NOT install the full Homebrew LLVM package.
          # Xcode already provides clang, strip, lipo and
          # install_name_tool.
          #
          # lld provides ld64.lld.
          # sevenzip provides 7zz.

          brew install lld sevenzip

          echo "Build tools installed."

      # ============================================================
      # 6. PREPARE TOOL NAMES
      # ============================================================
      - name: Prepare build tools
        shell: bash
        run: |
          set -e

          TOOLS="$FF_TOOLS_ROOT"

          mkdir -p "$TOOLS"

          echo "========================================"
          echo "PREPARE BUILD TOOLS"
          echo "========================================"

          # --------------------------------------------------------
          # Xcode tools
          # --------------------------------------------------------

          CLANG="$(xcrun --find clang)"
          STRIP="$(xcrun --find strip)"
          LIPO="$(xcrun --find lipo)"
          INSTALL_NAME="$(xcrun --find install_name_tool)"

          # --------------------------------------------------------
          # Homebrew tools
          # --------------------------------------------------------

          LLD_PREFIX="$(brew --prefix lld)"
          SEVENZIP="$(command -v 7zz)"

          LD64_LLD="$LLD_PREFIX/bin/ld64.lld"

          # --------------------------------------------------------
          # Verify tools
          # --------------------------------------------------------

          echo "clang:"
          echo "$CLANG"

          echo "strip:"
          echo "$STRIP"

          echo "lipo:"
          echo "$LIPO"

          echo "install_name_tool:"
          echo "$INSTALL_NAME"

          echo "ld64.lld:"
          echo "$LD64_LLD"

          echo "7zz:"
          echo "$SEVENZIP"

          test -x "$CLANG"
          test -x "$STRIP"
          test -x "$LIPO"
          test -x "$INSTALL_NAME"
          test -x "$LD64_LLD"
          test -x "$SEVENZIP"

          # --------------------------------------------------------
          # Create Windows-style names expected by build.ps1
          # --------------------------------------------------------

          ln -sf "$CLANG" \
            "$TOOLS/clang.exe"

          ln -sf "$LD64_LLD" \
            "$TOOLS/ld64.lld.exe"

          ln -sf "$LIPO" \
            "$TOOLS/llvm-lipo.exe"

          ln -sf "$INSTALL_NAME" \
            "$TOOLS/llvm-install-name-tool.exe"

          ln -sf "$STRIP" \
            "$TOOLS/llvm-strip.exe"

          ln -sf "$SEVENZIP" \
            "$TOOLS/7z.exe"

          chmod +x "$TOOLS"/*

          echo "$TOOLS" >> "$GITHUB_PATH"

          echo "========================================"
          echo "TOOLS READY"
          echo "========================================"

          ls -la "$TOOLS"

          echo "========================================"
          echo "CLANG VERSION"
          echo "========================================"

          "$TOOLS/clang.exe" --version

          echo "========================================"
          echo "LLD VERSION"
          echo "========================================"

          "$TOOLS/ld64.lld.exe" --version

          echo "========================================"
          echo "7-ZIP CHECK"
          echo "========================================"

          "$TOOLS/7z.exe" --help >/dev/null

          echo "7z OK"

      # ============================================================
      # 7. PYTHON DEPENDENCIES
      # ============================================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PYTHON"
          echo "========================================"

          python3 -m venv "$GITHUB_WORKSPACE/.venv"

          source "$GITHUB_WORKSPACE/.venv/bin/activate"

          python -m pip install --upgrade pip

          python -m pip install lief Pillow

          echo "Python:"
          python --version

          echo "LIEF:"
          python -c "import lief; print(lief.__version__)"

          echo "Pillow:"
          python -c "from PIL import Image; import PIL; print(PIL.__version__)"

          echo "Python dependencies OK"

      # ============================================================
      # 8. VERIFY EVERYTHING
      # ============================================================
      - name: Verify build environment
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFY BUILD ENVIRONMENT"
          echo "========================================"

          test -f "$BUILD_SCRIPT"
          test -f "$PROJECT_ROOT/app/ff_manager/build.ps1"

          test -d "$IOS_SDK"

          test -x "$FF_TOOLS_ROOT/clang.exe"
          test -x "$FF_TOOLS_ROOT/ld64.lld.exe"
          test -x "$FF_TOOLS_ROOT/llvm-lipo.exe"
          test -x "$FF_TOOLS_ROOT/llvm-install-name-tool.exe"
          test -x "$FF_TOOLS_ROOT/llvm-strip.exe"
          test -x "$FF_TOOLS_ROOT/7z.exe"

          echo "BUILD_SCRIPT:"
          echo "$BUILD_SCRIPT"

          echo "PROJECT_ROOT:"
          echo "$PROJECT_ROOT"

          echo "IOS_SDK:"
          echo "$IOS_SDK"

          echo "FF_TOOLS_ROOT:"
          echo "$FF_TOOLS_ROOT"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          echo "========================================"
          echo "ALL CHECKS PASSED"
          echo "========================================"

      # ============================================================
      # 9. BUILD IPA
      # ============================================================
      - name: Build IPA
        shell: pwsh
        env:
          IOS_SDK: ${{ env.IOS_SDK }}
          FF_TOOLS_ROOT: ${{ env.FF_TOOLS_ROOT }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "BUILD IPA"
          Write-Host "========================================"

          Write-Host "PROJECT_ROOT:"
          Write-Host $env:PROJECT_ROOT

          Write-Host "BUILD_SCRIPT:"
          Write-Host $env:BUILD_SCRIPT

          Write-Host "IOS_SDK:"
          Write-Host $env:IOS_SDK

          Write-Host "FF_TOOLS_ROOT:"
          Write-Host $env:FF_TOOLS_ROOT

          Write-Host "RELEASE_DIR:"
          Write-Host $env:RELEASE_DIR

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:RELEASE_DIR | Out-Null

          & $env:BUILD_SCRIPT `
            -IosSdk "$env:IOS_SDK" `
            -OutputDirectory "$env:RELEASE_DIR"

          if ($LASTEXITCODE -ne 0) {
            throw "IPA build failed with exit code $LASTEXITCODE"
          }

          Write-Host "========================================"
          Write-Host "BUILD SCRIPT FINISHED"
          Write-Host "========================================"

      # ============================================================
      # 10. FIND IPA
      # ============================================================
      - name: Find IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCH IPA"
          echo "========================================"

          echo "RELEASE_DIR:"
          echo "$RELEASE_DIR"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Release directory does not exist."
            exit 1
          fi

          echo "========================================"
          echo "RELEASE FILES"
          echo "========================================"

          find "$RELEASE_DIR" \
            -maxdepth 5 \
            -type f \
            -print

          echo "========================================"
          echo "SEARCH ALL IPA"
          echo "========================================"

          mapfile -t IPA_FILES < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.ipa" \
              -print
          )

          IPA_COUNT="${#IPA_FILES[@]}"

          echo "IPA COUNT: $IPA_COUNT"

          if [ "$IPA_COUNT" -eq 0 ]; then
            echo ""
            echo "NO IPA FOUND"
            echo ""

            echo "APP FILES:"
            find "$GITHUB_WORKSPACE" \
              -type d \
              -name "*.app" \
              -print || true

            echo ""
            echo "ZIP FILES:"
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name "*.zip" \
              -print || true

            exit 1
          fi

          echo "========================================"
          echo "IPA FOUND"
          echo "========================================"

          for IPA in "${IPA_FILES[@]}"; do
            echo "$IPA"
          done

          mkdir -p "$RELEASE_DIR"

          for IPA in "${IPA_FILES[@]}"; do
            cp -f "$IPA" "$RELEASE_DIR/"
          done

          echo "========================================"
          echo "FINAL IPA"
          echo "========================================"

          find "$RELEASE_DIR" \
            -type f \
            -name "*.ipa" \
            -print

      # ============================================================
      # 11. UPLOAD IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: ${{ env.RELEASE_DIR }}/*.ipa
          if-no-files-found: error
