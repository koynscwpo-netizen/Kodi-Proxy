name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ==========================================
      # LOCATE PROJECT
      # ==========================================
      - name: Locate project
        shell: bash
        run: |
          set -e

          echo "Searching project..."

          BUILD_SCRIPT="$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "BUILD-WINDOWS.ps1" \
            -not -path "*/.git/*" \
            -print -quit)"

          if [ -z "$BUILD_SCRIPT" ]; then
            echo "BUILD-WINDOWS.ps1 was not found."
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$BUILD_SCRIPT")"
          APP_ROOT="$SOURCE_ROOT/app/ff_manager"
          BUILD_PS1="$APP_ROOT/build.ps1"
          INPUT_DIR="$SOURCE_ROOT/inputs"
          RELEASE_DIR="$SOURCE_ROOT/release"
          TOOLS_DIR="$APP_ROOT/.tools"

          if [ ! -f "$BUILD_PS1" ]; then
            echo "build.ps1 was not found:"
            echo "$BUILD_PS1"
            exit 1
          fi

          if [ ! -f "$INPUT_DIR/FilzaSlop_1.0.3.ipa" ]; then
            echo "FilzaSlop_1.0.3.ipa was not found:"
            echo "$INPUT_DIR/FilzaSlop_1.0.3.ipa"
            exit 1
          fi

          mkdir -p "$RELEASE_DIR"
          mkdir -p "$TOOLS_DIR"

          echo "SOURCE_ROOT=$SOURCE_ROOT" >> "$GITHUB_ENV"
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "BUILD_PS1=$BUILD_PS1" >> "$GITHUB_ENV"
          echo "INPUT_DIR=$INPUT_DIR" >> "$GITHUB_ENV"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          echo "TOOLS_DIR=$TOOLS_DIR" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "PROJECT FOUND"
          echo "=========================================="
          echo "SOURCE_ROOT=$SOURCE_ROOT"
          echo "APP_ROOT=$APP_ROOT"
          echo "BUILD_PS1=$BUILD_PS1"
          echo "INPUT_DIR=$INPUT_DIR"
          echo "RELEASE_DIR=$RELEASE_DIR"

      # ==========================================
      # XCODE
      # ==========================================
      - name: Select Xcode
        shell: bash
        run: |
          set -e

          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          echo "=========================================="
          echo "XCODE"
          echo "=========================================="

          xcodebuild -version
          xcodebuild -showsdks

      # ==========================================
      # IPHONEOS SDK
      # ==========================================
      - name: Get iPhoneOS SDK
        shell: bash
        run: |
          set -e

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"

          if [ ! -d "$SDK" ]; then
            echo "iPhoneOS SDK not found."
            exit 1
          fi

          if [ ! -f \
            "$SDK/System/Library/Frameworks/UIKit.framework/Headers/UIKit.h"
          ]; then
            echo "UIKit headers not found."
            exit 1
          fi

          echo "IOS_SDK=$SDK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "IPHONEOS SDK"
          echo "=========================================="
          echo "$SDK"

      # ==========================================
      # INSTALL TOOLS
      # ==========================================
      - name: Install build tools
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALL BUILD TOOLS"
          echo "=========================================="

          brew update
          brew install llvm sevenzip

      # ==========================================
      # PREPARE TOOLS
      # ==========================================
      - name: Prepare build tools
        shell: bash
        run: |
          set -e

          LLVM="$(brew --prefix llvm)/bin"

          CLANG="$LLVM/clang"
          LLD="$LLVM/ld64.lld"
          LIPO="$LLVM/llvm-lipo"
          INSTALL_NAME="$LLVM/llvm-install-name-tool"
          STRIP="$LLVM/llvm-strip"
          SEVENZIP="$(brew --prefix sevenzip)/bin/7zz"

          echo "=========================================="
          echo "CHECK TOOLS"
          echo "=========================================="

          test -x "$CLANG"
          test -x "$LLD"
          test -x "$LIPO"
          test -x "$INSTALL_NAME"
          test -x "$STRIP"
          test -x "$SEVENZIP"

          ln -sf "$CLANG" \
            "$TOOLS_DIR/clang.exe"

          ln -sf "$LLD" \
            "$TOOLS_DIR/ld64.lld.exe"

          ln -sf "$LIPO" \
            "$TOOLS_DIR/llvm-lipo.exe"

          ln -sf "$INSTALL_NAME" \
            "$TOOLS_DIR/llvm-install-name-tool.exe"

          ln -sf "$STRIP" \
            "$TOOLS_DIR/llvm-strip.exe"

          ln -sf "$SEVENZIP" \
            "$TOOLS_DIR/7z.exe"

          chmod +x "$TOOLS_DIR"/*

          echo "$TOOLS_DIR" >> "$GITHUB_PATH"

          echo "clang.exe found."
          echo "ld64.lld.exe found."
          echo "llvm-lipo.exe found."
          echo "llvm-install-name-tool.exe found."
          echo "llvm-strip.exe found."
          echo "7z.exe found."

          echo "=========================================="
          echo "TOOLS READY"
          echo "=========================================="

          ls -la "$TOOLS_DIR"

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python3 -m pip install --upgrade pip
          python3 -m pip install lief

          echo "PYTHON=python3" >> "$GITHUB_ENV"

          python3 -c "import lief; print('LIEF OK')"

      # ==========================================
      # VERIFY PROJECT
      # ==========================================
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY PROJECT"
          echo "=========================================="

          test -f "$BUILD_PS1"
          test -f "$SOURCE_ROOT/BUILD-WINDOWS.ps1"

          test -f "$APP_ROOT/main.m"
          test -f "$APP_ROOT/Info.plist"
          test -f "$APP_ROOT/FrameworkInfo.plist"
          test -f "$APP_ROOT/protect_bridge.py"
          test -f "$APP_ROOT/generate_app_icons.py"
          test -f "$APP_ROOT/update_plist_version.py"

          test -f "$APP_ROOT/FFCacheManagerBackground.jpg"

          test -f "$APP_ROOT/resources/offline/BODY.ffcache"
          test -f "$APP_ROOT/resources/offline/NECK.ffcache"

          test -f "$INPUT_DIR/FilzaSlop_1.0.3.ipa"

          echo "All project files OK."

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build
        shell: pwsh
        env:
          IOS_SDK: ${{ env.IOS_SDK }}
          FF_TOOLS_ROOT: ${{ env.TOOLS_DIR }}
          PYTHON: python3
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=========================================="
          Write-Host "START BUILD"
          Write-Host "=========================================="

          Write-Host "SOURCE_ROOT:"
          Write-Host $env:SOURCE_ROOT

          Write-Host "BUILD_PS1:"
          Write-Host $env:BUILD_PS1

          Write-Host "IOS_SDK:"
          Write-Host $env:IOS_SDK

          Write-Host "FF_TOOLS_ROOT:"
          Write-Host $env:FF_TOOLS_ROOT

          Write-Host "RELEASE_DIR:"
          Write-Host $env:RELEASE_DIR

          Write-Host "FILZA IPA:"
          Write-Host "$env:INPUT_DIR/FilzaSlop_1.0.3.ipa"

          if (-not (Test-Path -LiteralPath $env:BUILD_PS1)) {
              throw "build.ps1 not found"
          }

          if (-not (Test-Path -LiteralPath $env:IOS_SDK)) {
              throw "iPhoneOS SDK not found"
          }

          if (-not (Test-Path -LiteralPath $env:FF_TOOLS_ROOT)) {
              throw "Build tools directory not found"
          }

          $Filza = Join-Path `
            $env:INPUT_DIR `
            "FilzaSlop_1.0.3.ipa"

          if (-not (Test-Path -LiteralPath $Filza)) {
              throw "FilzaSlop_1.0.3.ipa not found"
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:RELEASE_DIR | Out-Null

          # IMPORTANT:
          # Call build.ps1 directly.
          # Do NOT call BUILD-WINDOWS.ps1 from here.
          & pwsh `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $env:BUILD_PS1 `
            -FilzaIpa $Filza `
            -Offline `
            -OutputDirectory $env:RELEASE_DIR

          if ($LASTEXITCODE -ne 0) {
              throw "Build failed with exit code $LASTEXITCODE"
          }

          Write-Host "=========================================="
          Write-Host "BUILD SCRIPT FINISHED"
          Write-Host "=========================================="

      # ==========================================
      # VERIFY IPA
      # ==========================================
      - name: Verify IPA
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFY IPA"
          echo "=========================================="

          find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -print

          IPA="$(find "$RELEASE_DIR" \
            -maxdepth 2 \
            -type f \
            -name "*.ipa" \
            -print -quit)"

          if [ -z "$IPA" ]; then
            echo "ERROR: IPA was not generated."
            exit 1
          fi

          echo "IPA FOUND:"
          echo "$IPA"

          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      # ==========================================
      # UPLOAD
      # ==========================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FF-Cache-Manager-IPA
          path: ${{ env.RELEASE_DIR }}/*.ipa
          if-no-files-found: error
